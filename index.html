<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>chip3625</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    text-align: center;
    color: white;

    background: url("background.png") no-repeat center center;
    background-size: cover;
}

/* затемнение */
body::before {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.55);
    z-index: 0;
}

.main {
    position: relative;
    z-index: 1;
    margin-top: 240px; /* БЫЛО 180px — стало ниже */
    display: flex;
    flex-direction: column;
    align-items: center;
}

.button {
    width: 260px;
    padding: 18px;
    margin: 18px 0;
    font-size: 20px;
    font-weight: bold;
    border-radius: 10px;
    text-decoration: none;
    color: white;
    transition: 0.3s;
}

.da {
    background: #ff6a00;
}

.dp {
    background: #8a2be2;
}

.button:hover {
    transform: scale(1.05);
    opacity: 0.9;
}

.footer {
    position: relative;
    z-index: 1;
    margin-bottom: 100px; /* было 60px — опустили ниже */
    font-size: 30px;
    font-weight: bold;
    color: #9146FF;
    text-shadow: 0 0 15px rgba(145,70,255,0.8);
}
</style>
</head>

<body>

<div class="main">
    <a href="https://www.donationalerts.com/r/mrsaxar_" target="_blank" class="button da">
        DonationAlerts
    </a>

    <a href="https://donatepay.eu/don/39957" target="_blank" class="button dp">
        DonatePay
    </a>
</div>

<div class="footer">
    🎮 Twitch chip3625
</div>

</body>
</html>
