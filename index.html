<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chip3625</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    height: 100vh;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

/* Фон */
.background {
    position: relative;
    width: 100%;
    height: 100vh;
    background: url("background.png") no-repeat center center;
    background-size: cover;
}

/* Затемнение */
.background::after {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.35);
}

/* Контейнер кнопок */
.buttons {
    position: absolute;
    top: 55%; /* уровень бронежилета */
    left: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    gap: 30px;
    z-index: 2;
}

/* Кнопки */
.btn {
    padding: 18px 35px;
    font-size: 20px;
    font-weight: bold;
    border-radius: 12px;
    text-decoration: none;
    color: white;
    transition: 0.3s ease;
}

/* DonationAlerts */
.da {
    background: #ff6a00;
    box-shadow: 0 0 15px #ff6a00;
}

/* DonatePay */
.dp {
    background: #8a2be2;
    box-shadow: 0 0 15px #8a2be2;
}

/* Hover эффект */
.btn:hover {
    transform: scale(1.1);
    box-shadow: 0 0 30px white;
}
</style>
</head>

<body>

<div class="background">

    <div class="buttons">
        <a href="https://www.donationalerts.com/r/mrsaxar_" target="_blank" class="btn da">
            DonationAlerts
        </a>

        <a href="https://donatepay.eu/don/39957" target="_blank" class="btn dp">
            DonatePay
        </a>
    </div>

</div>

</body>
</html>
