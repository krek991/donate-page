<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>chip3625</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    text-align: center;
    color: white;

    background: url("background.png") no-repeat center center;
    background-size: cover; /* НЕ обрезает, адаптируется */
}

/* затемнение чтобы текст читался */
body::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.5);
    z-index: 0;
}

.content {
    position: relative;
    z-index: 1;
    margin-top: 60px;
}

h1 {
    font-size: 36px;
    margin-bottom: 30px;
}

.buttons {
    margin-top: 20px;
}

.button {
    display: inline-block;
    padding: 15px 30px;
    margin: 10px;
    font-size: 18px;
    font-weight: bold;
    border-radius: 8px;
    text-decoration: none;
    color: white;
    transition: 0.3s;
}

.da {
    background-color: #ff6a00;
}

.dp {
    background-color: #8a2be2;
}

.button:hover {
    transform: scale(1.05);
    opacity: 0.9;
}

.footer {
    position: relative;
    z-index: 1;
    margin-bottom: 30px;
    font-size: 20px;
}
</style>
</head>

<body>

<div class="content">
    <h1>Поддержите стримера</h1>

    <div class="buttons">
        <a href="https://www.donationalerts.com/r/mrsaxar_" target="_blank" class="button da">
            DonationAlerts
        </a>

        <a href="https://donatepay.eu/don/39957" target="_blank" class="button dp">
            DonatePay
        </a>
    </div>
</div>

<div class="footer">
    Twitch chip3625
</div>

</body>
</html>
