<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>chip3625 Donate</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: black;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
}

/* КОНТЕЙНЕР */
.wrapper {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* КАРТИНКА БЕЗ ОБРЕЗКИ */
.wrapper img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
}

/* КЛИКАБЕЛЬНЫЕ ЗОНЫ */
.link {
    position: absolute;
    display: block;
    border-radius: 15px;
    transition: 0.3s;
}

/* DonationAlerts */
.donationalerts {
    width: 420px;
    height: 90px;
    bottom: 32%;
    left: 50%;
    transform: translateX(-50%);
}

/* DonatePay */
.donatepay {
    width: 420px;
    height: 90px;
    bottom: 22%;
    left: 50%;
    transform: translateX(-50%);
}

/* Hover эффект */
.link:hover {
    box-shadow: 0 0 35px rgba(255,255,255,0.8);
}
</style>
</head>

<body>

<div class="wrapper">

    <!-- ВАЖНО: имя файла строго bg.PNG -->
    <img src="bg.PNG" alt="Donate Page">

    <a href="https://www.donationalerts.com/r/mrsaxar_" 
       class="link donationalerts" 
       target="_blank"></a>

    <a href="https://donatepay.eu/don/39957" 
       class="link donatepay" 
       target="_blank"></a>

</div>

</body>
</html>
