<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>chip3625</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    text-align: center;
    color: white;

    background: url("background.png") no-repeat center center;
    background-size: cover;
    background-attachment: fixed; /* эффект глубины */
}

/* затемнение */
body::before {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.55);
    z-index: 0;
}

.main {
    position: relative;
    z-index: 1;
    margin-top: 320px;
    display: flex;
    flex-direction: column;
    align-items: center;

    animation: fadeInUp 1.2s ease forwards;
    opacity: 0;
}

/* Плавное появление */
@keyframes fadeInUp {
    from { opacity: 0; transform: translateY(40px); }
    to { opacity: 1; transform: translateY(0); }
}

/* Кнопки */
.button {
    width: 270px;
    padding: 20px;
    margin: 20px 0;
    font-size: 21px;
    font-weight: bold;
    border-radius: 12px;
    text-decoration: none;
    color: white;
    transition: 0.3s;
}

/* Неоновые цвета */
.da {
    background: #ff6a00;
    box-shadow: 0 0 15px #ff6a00;
}

.dp {
    background: #8a2be2;
    box-shadow: 0 0 15px #8a2be2;
}

/* Hover эффект */
.button:hover {
    transform: scale(1.07);
    box-shadow: 0 0 25px white;
    opacity: 0.9;
}

/* Twitch текст */
.footer {
    position: relative;
    z-index: 1;
    margin-bottom: 140px;
    font-size: 32px;
    font-weight: bold;
    color: #9146FF;
    text-shadow: 0 0 18px rgba(145,70,255,0.9);
    animation: glow 2s infinite alternate;
}

/* Пульсирование Twitch текста */
@keyframes glow {
    from { text-shadow: 0 0 10px #9146FF; }
    to { text-shadow: 0 0 25px #c084ff; }
}
</style>
</head>

<body>

<div class="main">
    <a href="https://www.donationalerts.com/r/mrsaxar_" target="_blank" class="button da">
        DonationAlerts
    </a>

    <a href="https://donatepay.eu/don/39957" target="_blank" class="button dp">
        DonatePay
    </a>
</div>

<div class="footer">
    🎮 Twitch chip3625
</div>

</body>
</html>
