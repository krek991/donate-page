<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>chip3625 | GTA Majestic</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    height: 100vh;
    background: url("bg.png") no-repeat center center/cover;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, Helvetica, sans-serif;
}

/* Затемнение для текста и кнопок */
.overlay {
    background: rgba(0,0,0,0.65);
    padding: 40px;
    border-radius: 20px;
    text-align: center;
    backdrop-filter: blur(6px);
    position: absolute;
}

/* Заголовок */
h1 {
    font-size: 60px;
    color: white;
    margin-bottom: 10px;
}

/* Подзаголовок */
.subtitle {
    color: #ddd;
    margin-bottom: 30px;
    font-size: 20px;
}

/* Контейнер кнопок */
.buttons {
    display: flex;
    flex-direction: column;
    gap: 20px;
    align-items: center;
}

/* Кнопки */
.btn {
    width: 300px;
    padding: 15px;
    text-align: center;
    font-size: 20px;
    font-weight: bold;
    color: white;
    text-decoration: none;
    border-radius: 12px;
    transition: 0.2s ease;
}

/* DonationAlerts */
.da {
    background: linear-gradient(45deg,#ff6a00,#ffb300);
    box-shadow: 0 0 20px rgba(255,140,0,0.8);
}

/* DonatePay */
.dp {
    background: linear-gradient(45deg,#7b2ff7,#c471ed);
    box-shadow: 0 0 20px rgba(170,0,255,0.8);
}

/* Эффект наведения */
.btn:hover {
    transform: scale(1.08);
}

/* Эффект нажатия */
.btn:active {
    transform: scale(0.95);
}

/* Подпись внизу */
footer {
    position: absolute;
    bottom: 20px;
    width: 100%;
    text-align: center;
    color: #ddd;
    font-size: 16px;
}
</style>
</head>

<body>

<div class="overlay">
    <h1>chip3625</h1>
    <div class="subtitle">Поддержи игрока Majestic RP</div>

    <div class="buttons">
        <a href="https://www.donationalerts.com/r/mrsaxar_" target="_blank" class="btn da">
            ❤️ DonationAlerts
        </a>

        <a href="https://donatepay.eu/don/39957" target="_blank" class="btn dp">
            💜 DonatePay
        </a>
    </div>
</div>

<footer>GTA V | Majestic RP | chip3625</footer>

</body>
</html>
