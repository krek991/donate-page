<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>chip3625 Donate</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    height: 100vh;
    overflow: hidden;
}

/* КОНТЕЙНЕР */
.wrapper {
    position: relative;
    width: 100vw;
    height: 100vh;
}

/* ФОН НА ВЕСЬ ЭКРАН БЕЗ ЧЁРНЫХ ПОЛОС */
.wrapper img {
    position: absolute;
    width: 100%;
    height: 100%;
    object-fit: cover; /* Заполняет экран полностью */
}

/* КЛИКАБЕЛЬНЫЕ ЗОНЫ */
.link {
    position: absolute;
    border-radius: 20px;
    transition: 0.3s;
}

/* 🔥 Позиции в процентах (адаптив под 1920x1080) */

/* DonationAlerts */
.donationalerts {
    width: 22%;
    height: 8%;
    left: 39%;
    top: 58%;
}

/* DonatePay */
.donatepay {
    width: 22%;
    height: 8%;
    left: 39%;
    top: 69%;
}

/* Hover эффект */
.link:hover {
    box-shadow: 0 0 40px rgba(255,255,255,0.9);
}
</style>
</head>

<body>

<div class="wrapper">

    <img src="bg.PNG" alt="Donate Page">

    <a href="https://www.donationalerts.com/r/mrsaxar_" 
       class="link donationalerts" 
       target="_blank"></a>

    <a href="https://donatepay.eu/don/39957" 
       class="link donatepay" 
       target="_blank"></a>

</div>

</body>
</html>
