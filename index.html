<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Support chip3625</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    width: 100%;
    height: 100vh;
    font-family: 'Arial', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    color: white;
    overflow: hidden;
}

/* ФОН */
.background {
    position: fixed;
    width: 100%;
    height: 100%;
    background: url('bg.PNG') no-repeat center center;
    background-size: cover;
    background-position: center center;
    z-index: -2;
}

/* Затемнение */
.overlay {
    position: fixed;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.45);
    z-index: -1;
}

.content {
    max-width: 900px;
    animation: fadeIn 1.2s ease-in-out;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

h1 {
    font-size: 64px;
    font-weight: 900;
    text-shadow: 0 0 25px rgba(0,0,0,0.9);
}

.subtitle {
    font-size: 26px;
    margin: 15px 0 40px;
    opacity: 0.95;
}

/* КНОПКИ */
.button {
    display: block;
    width: 420px;
    margin: 20px auto;
    padding: 22px;
    font-size: 26px;
    font-weight: bold;
    text-decoration: none;
    border-radius: 14px;
    transition: all 0.3s ease;
    letter-spacing: 1px;
}

.donationalerts {
    background: linear-gradient(45deg, #ff7a00, #ff3c00);
    color: white;
    box-shadow: 0 0 25px rgba(255,100,0,0.8);
}

.donatepay {
    background: linear-gradient(45deg, #7a00ff, #b000ff);
    color: white;
    box-shadow: 0 0 25px rgba(150,0,255,0.8);
}

/* Hover */
.button:hover {
    transform: scale(1.08);
    box-shadow: 0 0 45px rgba(255,255,255,0.9);
}

/* Twitch подпись */
.footer {
    margin-top: 50px;
    font-size: 18px;
    opacity: 0.85;
}

/* Адаптация */
@media (max-width: 768px) {
    h1 {
        font-size: 42px;
    }

    .button {
        width: 90%;
        font-size: 20px;
    }
}
</style>
</head>

<body>

<div class="background"></div>
<div class="overlay"></div>

<div class="content">
    <h1>💰 chip3625 💰</h1>
    <div class="subtitle">Поддержи стримера в GTA 🖤</div>

    <a href="https://www.donationalerts.com/r/mrsaxar_" 
       class="button donationalerts" 
       target="_blank">
        ❤️ DonationAlerts
    </a>

    <a href="https://donatepay.eu/don/39957" 
       class="button donatepay" 
       target="_blank">
        💜 DonatePay
    </a>

    <div class="footer">
        🎮 Twitch: chip3625 | Majestic RolePlay
    </div>
</div>

</body>
</html>
