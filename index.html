<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>chip3625 | DONATE</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  font-family: Arial, Helvetica, sans-serif;
  height: 100%;
  overflow: hidden;
  background: black;
  color: white;
}

/* GTA-style dark city background */
body::before {
  content: "";
  position: fixed;
  width: 100%;
  height: 100%;
  background: 
    linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.85)),
    url("https://images.unsplash.com/photo-1508057198894-247b23fe5ade?q=80&w=2070");
  background-size: cover;
  background-position: center;
  z-index: -2;
}

/* Money rain effect */
.money {
  position: fixed;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: -1;
  overflow: hidden;
}

.money span {
  position: absolute;
  color: #00ff66;
  font-weight: bold;
  animation: fall linear infinite;
  opacity: 0.7;
}

@keyframes fall {
  from { transform: translateY(-100px); }
  to { transform: translateY(110vh); }
}

/* Main block */
.container {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  width: 100%;
}

h1 {
  font-size: 3.5em;
  letter-spacing: 3px;
  margin-bottom: 10px;
  text-transform: uppercase;
  text-shadow: 0 0 20px #00ff66;
}

.subtitle {
  font-size: 1.3em;
  margin-bottom: 40px;
  opacity: 0.8;
}

/* Buttons */
.btn {
  display: block;
  width: 340px;
  margin: 20px auto;
  padding: 18px;
  border-radius: 8px;
  text-decoration: none;
  font-size: 1.3em;
  font-weight: bold;
  transition: 0.3s ease;
  border: 2px solid #00ff66;
}

.da {
  background: rgba(0,0,0,0.7);
  color: #ff6a00;
  border-color: #ff6a00;
}

.da:hover {
  background: #ff6a00;
  color: black;
  box-shadow: 0 0 25px #ff6a00;
  transform: scale(1.08);
}

.dp {
  background: rgba(0,0,0,0.7);
  color: #00ff66;
  border-color: #00ff66;
}

.dp:hover {
  background: #00ff66;
  color: black;
  box-shadow: 0 0 25px #00ff66;
  transform: scale(1.08);
}

footer {
  position: absolute;
  bottom: 20px;
  width: 100%;
  text-align: center;
  font-size: 1em;
  opacity: 0.6;
}
</style>
</head>

<body>

<div class="money" id="money"></div>

<div class="container">
  <h1>chip3625</h1>
  <div class="subtitle">Поддержи игрока Majestic RP</div>

  <a class="btn da" href="https://www.donationalerts.com/r/mrsaxar_" target="_blank">
    💸 DONATIONALERTS
  </a>

  <a class="btn dp" href="https://donatepay.eu/don/39957" target="_blank">
    💰 DONATEPAY
  </a>
</div>

<footer>GTA V | Majestic RP | chip3625</footer>

<script>
const container = document.getElementById("money");

for (let i = 0; i < 40; i++) {
  const span = document.createElement("span");
  span.innerHTML = "$";
  span.style.left = Math.random() * 100 + "vw";
  span.style.fontSize = (Math.random() * 20 + 15) + "px";
  span.style.animationDuration = (Math.random() * 5 + 5) + "s";
  span.style.animationDelay = Math.random() * 5 + "s";
  container.appendChild(span);
}
</script>

</body>
</html>
